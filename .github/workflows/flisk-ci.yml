# Shared Flisk CI from flisk-sh/.github: build and test, dependency review, CodeQL.
name: Flisk CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # weekly CodeQL, so new vulnerability queries reach code that has not changed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flisk-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name != 'schedule'
    uses: flisk-sh/.github/.github/workflows/ci.yml@ff7a7679eb6a0af56f5972b49586967c3c65aa8a # v1.3.1
    with:
      # Lint only: tests need a Postgres DATABASE_URL and builds need generated .autogenerated files (flisk up).
      scripts: "lint"

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: flisk-sh/.github/.github/workflows/dependency-review.yml@ff7a7679eb6a0af56f5972b49586967c3c65aa8a # v1.3.1

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: flisk-sh/.github/.github/workflows/codeql.yml@ff7a7679eb6a0af56f5972b49586967c3c65aa8a # v1.3.1
